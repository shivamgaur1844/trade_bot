<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel One Auto Trading Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex justify-between items-center py-4">
            <div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                    AutoTrade Pro
                </h1>
                <p class="text-slate-400 text-sm mt-1">SmartAPI Powered Trading Engine</p>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-red-500" id="status-indicator"></span>
                    <span class="text-sm font-medium" id="status-text">Disconnected</span>
                </div>
                <button id="start-btn" onclick="startBot()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-medium transition-colors shadow-lg shadow-emerald-500/20">
                    Start Bot
                </button>
                <button id="stop-btn" onclick="stopBot()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-medium transition-colors shadow-lg shadow-red-500/20 hidden">
                    Stop Bot
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Settings Panel -->
            <div class="glass-panel p-6 lg:col-span-1 h-fit">
                <h2 class="text-xl font-semibold mb-6 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Market & Settings
                </h2>
                
                <div class="space-y-4">
                    <!-- Category Selection -->
                    <div>
                        <label class="block text-sm text-slate-400 mb-2">Market Category</label>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="cursor-pointer text-center">
                                <input type="radio" name="category" value="INDICES" class="peer sr-only" checked onchange="toggleCategory()">
                                <div class="px-1 py-1.5 rounded border border-slate-700 bg-slate-800 text-xs font-medium text-slate-400 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 transition-colors">Indices</div>
                            </label>
                            <label class="cursor-pointer text-center">
                                <input type="radio" name="category" value="STOCKS" class="peer sr-only" onchange="toggleCategory()">
                                <div class="px-1 py-1.5 rounded border border-slate-700 bg-slate-800 text-xs font-medium text-slate-400 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 transition-colors">Stocks</div>
                            </label>
                            <label class="cursor-pointer text-center">
                                <input type="radio" name="category" value="OPTIONS" class="peer sr-only" onchange="toggleCategory()">
                                <div class="px-1 py-1.5 rounded border border-slate-700 bg-slate-800 text-xs font-medium text-slate-400 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 transition-colors">Options</div>
                            </label>
                        </div>
                    </div>

                    <!-- Dynamic Input Area -->
                    <div id="input-indices">
                        <label class="block text-sm text-slate-400 mb-1">Select Index</label>
                        <select id="symbol-index" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                            <option value="NIFTY">NIFTY 50</option>
                            <option value="BANKNIFTY">BANK NIFTY</option>
                            <option value="SENSEX">SENSEX</option>
                        </select>
                    </div>

                    <div id="input-stocks" class="hidden">
                        <label class="block text-sm text-slate-400 mb-1">Search Stock Symbol</label>
                        <input type="text" id="symbol-stock" list="stock-list" placeholder="e.g. RELIANCE, TCS" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 uppercase">
                        <datalist id="stock-list">
                            <option value="RELIANCE">Reliance Industries</option>
                            <option value="TCS">Tata Consultancy Services</option>
                            <option value="HDFCBANK">HDFC Bank</option>
                            <option value="INFY">Infosys</option>
                            <option value="ICICIBANK">ICICI Bank</option>
                            <option value="SBIN">State Bank of India</option>
                            <option value="BHARTIARTL">Bharti Airtel</option>
                            <option value="ITC">ITC Limited</option>
                            <option value="LART">Larsen & Toubro</option>
                            <option value="BAJFINANCE">Bajaj Finance</option>
                        </datalist>
                    </div>

                    <div id="input-options" class="hidden">
                        <label class="block text-sm text-slate-400 mb-1">Select Index for Options</label>
                        <select id="symbol-option" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 mb-3">
                            <option value="NIFTY">NIFTY 50 Options</option>
                            <option value="BANKNIFTY">BANK NIFTY Options</option>
                        </select>
                        
                        <label class="block text-sm text-slate-400 mb-1">Option Moneyness</label>
                        <select id="moneyness-select" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                            <option value="ATM">Target ATM (At The Money)</option>
                            <option value="ITM">Target ITM (In The Money)</option>
                            <option value="OTM">Target OTM (Out of The Money)</option>
                        </select>
                    </div>

                    <!-- Strategy Selection -->
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">AI Trading Strategy</label>
                        <select id="strategy-select" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-purple-500 text-purple-100">
                            <option value="CONSERVATIVE">🎯 Conservative (Sniper)</option>
                            <option value="BALANCED">⚖️ Balanced (Trend)</option>
                            <option value="AGGRESSIVE">⚡ Aggressive (Momentum)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Investment Amount (₹)</label>
                        <input type="number" id="investmentAmount" value="10000" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Take Profit Target (₹)</label>
                        <input type="number" id="takeProfit" value="1000" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Stop Loss Limit (₹)</label>
                        <input type="number" id="stopLoss" value="500" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Max Daily Trades</label>
                        <input type="number" id="maxTrades" value="5" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                    </div>
                    
                    <button onclick="saveSettings()" class="w-full bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium mt-4 transition-colors">
                        Update Settings
                    </button>
                    <p id="save-msg" class="text-sm text-emerald-400 text-center hidden">Settings Saved!</p>
                </div>
            </div>

            <!-- Main Dashboard Area -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Stats Row -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-panel p-6">
                        <p class="text-slate-400 text-sm mb-1">Current Price (LTP)</p>
                        <div class="text-3xl font-bold font-mono" id="ltp-display">₹0.00</div>
                    </div>
                    <div class="glass-panel p-6">
                        <p class="text-slate-400 text-sm mb-1">Trades Executed</p>
                        <div class="text-3xl font-bold font-mono text-blue-400">
                            <span id="trades-executed">0</span> <span class="text-lg text-slate-500">/ <span id="trades-max">5</span></span>
                        </div>
                    </div>
                </div>

                <!-- Chart Panel -->
                <div class="glass-panel p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold flex items-center">
                            <svg class="w-5 h-5 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                            Live Market Chart
                        </h2>
                        <div class="flex space-x-1 bg-slate-800 rounded-lg p-1 border border-slate-700" id="timeframe-selector">
                            <button onclick="setTimeframe('ONE_MINUTE', this)" class="tf-btn px-3 py-1 text-sm rounded-md bg-blue-500 text-white font-medium transition-colors">1m</button>
                            <button onclick="setTimeframe('FIVE_MINUTE', this)" class="tf-btn px-3 py-1 text-sm rounded-md hover:bg-slate-700 text-slate-300 font-medium transition-colors">5m</button>
                            <button onclick="setTimeframe('FIFTEEN_MINUTE', this)" class="tf-btn px-3 py-1 text-sm rounded-md hover:bg-slate-700 text-slate-300 font-medium transition-colors">15m</button>
                            <button onclick="setTimeframe('ONE_HOUR', this)" class="tf-btn px-3 py-1 text-sm rounded-md hover:bg-slate-700 text-slate-300 font-medium transition-colors">1H</button>
                            <button onclick="setTimeframe('ONE_DAY', this)" class="tf-btn px-3 py-1 text-sm rounded-md hover:bg-slate-700 text-slate-300 font-medium transition-colors">1D</button>
                        </div>
                    </div>
                    <div id="chart-container" class="w-full h-[400px] rounded-lg overflow-hidden border border-slate-700 bg-slate-900"></div>
                </div>

                <!-- Logs Panel -->
                <div class="glass-panel p-6">
                    <h2 class="text-xl font-semibold mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        Bot Activity Logs
                    </h2>
                    <div class="bg-slate-900 rounded-lg p-4 h-64 overflow-y-auto font-mono text-sm space-y-2" id="log-container">
                        <!-- Logs injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Chart Initialization
        const chartProperties = {
            layout: { 
                background: { type: 'solid', color: '#0f172a' }, 
                textColor: '#cbd5e1' 
            },
            grid: { 
                vertLines: { color: '#334155', style: 1 }, 
                horzLines: { color: '#334155', style: 1 } 
            },
            crosshair: { 
                mode: LightweightCharts.CrosshairMode.Normal 
            },
            rightPriceScale: { 
                borderColor: '#475569' 
            },
            timeScale: { 
                borderColor: '#475569', 
                timeVisible: true,
                secondsVisible: false
            }
        };
        const domElement = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(domElement, chartProperties);
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#10b981', 
            downColor: '#ef4444', 
            borderDownColor: '#ef4444', 
            borderUpColor: '#10b981', 
            wickDownColor: '#ef4444', 
            wickUpColor: '#10b981'
        });

        // Handle Resize
        new ResizeObserver(entries => {
            if (entries.length === 0 || entries[0].target !== domElement) { return; }
            const newRect = entries[0].contentRect;
            chart.applyOptions({ height: newRect.height, width: newRect.width });
        }).observe(domElement);

        let currentInterval = 'ONE_MINUTE';
        
        function setTimeframe(interval, btn) {
            currentInterval = interval;
            
            // Update button styles
            document.querySelectorAll('.tf-btn').forEach(b => {
                b.className = 'tf-btn px-3 py-1 text-sm rounded-md hover:bg-slate-700 text-slate-300 font-medium transition-colors';
            });
            btn.className = 'tf-btn px-3 py-1 text-sm rounded-md bg-blue-500 text-white font-medium transition-colors';
            
            candleSeries.setData([]); // clear chart temporarily
            saveSettings(); // Send new interval to backend
        }

        // Start Bot
        function startBot() {
            fetch('/api/start', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if(data.status === 'success') {
                        document.getElementById('start-btn').classList.add('hidden');
                        document.getElementById('stop-btn').classList.remove('hidden');
                    }
                });
        }

        // Stop Bot
        function stopBot() {
            fetch('/api/stop', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if(data.status === 'success') {
                        document.getElementById('stop-btn').classList.add('hidden');
                        document.getElementById('start-btn').classList.remove('hidden');
                    }
                });
        }

        // Category Toggle
        function toggleCategory() {
            const category = document.querySelector('input[name="category"]:checked').value;
            document.getElementById('input-indices').classList.add('hidden');
            document.getElementById('input-stocks').classList.add('hidden');
            document.getElementById('input-options').classList.add('hidden');
            
            if (category === 'INDICES') document.getElementById('input-indices').classList.remove('hidden');
            if (category === 'STOCKS') document.getElementById('input-stocks').classList.remove('hidden');
            if (category === 'OPTIONS') document.getElementById('input-options').classList.remove('hidden');
        }

        // Save Settings
        function saveSettings() {
            const category = document.querySelector('input[name="category"]:checked').value;
            let finalSymbol = "";
            if (category === 'INDICES') finalSymbol = document.getElementById('symbol-index').value;
            if (category === 'STOCKS') finalSymbol = document.getElementById('symbol-stock').value.toUpperCase();
            if (category === 'OPTIONS') finalSymbol = document.getElementById('symbol-option').value;
            
            const settings = {
                category: category,
                symbol: finalSymbol,
                strategy: document.getElementById('strategy-select').value,
                moneyness: document.getElementById('moneyness-select').value,
                investmentAmount: document.getElementById('investmentAmount').value,
                takeProfit: document.getElementById('takeProfit').value,
                stopLoss: document.getElementById('stopLoss').value,
                maxTrades: document.getElementById('maxTrades').value,
                interval: currentInterval
            };

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            }).then(r => r.json()).then(data => {
                if(data.status === 'success') {
                    const msg = document.getElementById('save-msg');
                    msg.classList.remove('hidden');
                    setTimeout(() => msg.classList.add('hidden'), 3000);
                }
            });
        }

        // Poll Status every 2 seconds
        setInterval(() => {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    // Update connection indicator
                    const indicator = document.getElementById('status-indicator');
                    const text = document.getElementById('status-text');
                    
                    if (data.isRunning) {
                        indicator.className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';
                        text.innerText = data.connected ? 'Running (Connected)' : 'Running (Connecting...)';
                        document.getElementById('start-btn').classList.add('hidden');
                        document.getElementById('stop-btn').classList.remove('hidden');
                    } else {
                        indicator.className = 'w-3 h-3 rounded-full bg-red-500';
                        text.innerText = 'Stopped';
                        document.getElementById('stop-btn').classList.add('hidden');
                        document.getElementById('start-btn').classList.remove('hidden');
                    }

                    // Update stats
                    document.getElementById('ltp-display').innerText = '₹' + data.lastPrice.toFixed(2);
                    document.getElementById('trades-executed').innerText = data.currentTrades;
                    document.getElementById('trades-max').innerText = data.maxTrades;
                    
                    // Update inputs if not focused
                    if(document.activeElement.id !== 'symbol') document.getElementById('symbol').value = data.symbol;
                    if(document.activeElement.id !== 'maxTrades') document.getElementById('maxTrades').value = data.maxTrades;

                    // Update logs
                    const logContainer = document.getElementById('log-container');
                    logContainer.innerHTML = '';
                    data.logs.forEach(log => {
                        const div = document.createElement('div');
                        div.className = log.includes('Error') ? 'text-red-400' : (log.includes('BUY') || log.includes('SELL')) ? 'text-emerald-400' : 'text-slate-300';
                        div.innerText = log;
                        logContainer.appendChild(div);
                    });
                    logContainer.scrollTop = logContainer.scrollHeight;

                    // Update Chart Data
                    if (data.candles && data.candles.length > 0) {
                        // Ensure chronological order
                        candleSeries.setData(data.candles);
                        
                        // Set markers for trades
                        if (data.tradeHistory && data.tradeHistory.length > 0) {
                            const markers = data.tradeHistory.map(trade => {
                                let markerText = '';
                                if (trade.type === 'BUY') {
                                    if (trade.opt_symbol) markerText = `BUY ${trade.opt_symbol} @ ₹${trade.opt_price} (${trade.qty} Qty)`;
                                    else markerText = `BUY ${trade.qty || 0} Qty @ ₹${trade.price}`;
                                } else {
                                    if (trade.opt_symbol) markerText = `SELL ${trade.opt_symbol} PNL: ₹${trade.pnl}`;
                                    else markerText = `SELL PNL: ₹${trade.pnl}`;
                                }

                                return {
                                    time: trade.time,
                                    position: trade.type === 'BUY' ? 'belowBar' : 'aboveBar',
                                    color: trade.type === 'BUY' ? '#10b981' : '#ef4444',
                                    shape: trade.type === 'BUY' ? 'arrowUp' : 'arrowDown',
                                    text: markerText
                                };
                            });
                            // Lightweight charts requires markers to be sorted by time
                            markers.sort((a, b) => a.time - b.time);
                            candleSeries.setMarkers(markers);
                        }
                    }
                });
        }, 2000);
    </script>
</body>
</html>
